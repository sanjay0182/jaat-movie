<style>
:root{color-scheme:dark;--bg:#0a0a0d;--panel:#141419;--panel2:#1c1c24;--line:#25252f;--text:#f2f3f7;--dim:#9a9fb0;--accent:#ff5330;--accent2:#ff8f45;--glass:rgba(10,10,13,.88);--shadow:0 8px 26px rgba(0,0,0,.45)}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{overflow-x:hidden}
html,body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 Poppins,system-ui,sans-serif}

::-webkit-scrollbar{display:none}*{scrollbar-width:none}

.logo{font-weight:900;font-style:italic;font-size:21px;white-space:nowrap;letter-spacing:-.5px;text-transform:uppercase;cursor:pointer}
.logo b{background:linear-gradient(90deg,var(--accent),var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent;padding-right:3px}
.spill{flex:1;min-width:0;display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:10px 16px;color:var(--dim);text-align:left}
.ib{background:var(--panel);border:1px solid var(--line);border-radius:50%;width:42px;height:42px;flex:0 0 auto;display:flex;align-items:center;justify-content:center;padding:0}

.pri{background:linear-gradient(135deg,var(--accent),var(--accent2));border:0;color:#fff;font-weight:700;border-radius:14px;padding:12px 24px;box-shadow:0 6px 18px rgba(255,83,48,.35)}
.pri:active{transform:scale(.97)}
.btn{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:9px 16px;font-weight:600}
main{max-width:1180px;margin:0 auto;padding:6px 16px 110px;min-height:70vh}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--glass);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--line);display:flex;padding:6px 6px calc(6px + env(safe-area-inset-bottom))}

.hero{position:relative;border-radius:22px;overflow:hidden;min-height:390px;display:flex;align-items:flex-end;margin:8px 0 12px;background:var(--panel2);box-shadow:var(--shadow)}

.hero .art{position:absolute;z-index:1;right:18px;top:40px;height:150px;border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.55);object-fit:cover}
.hero.land .bg{transform:scale(1.02);filter:none}.hero.land .art{display:none}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.05),rgba(0,0,0,.25) 35%,rgba(10,10,13,.94))}

.toptabs{margin-top:2px;gap:4px}
.toptabs .cat{background:none;border:0;padding:6px 12px;font-size:15px;color:var(--dim);border-radius:8px}

.rail{display:grid;grid-auto-flow:column;grid-auto-columns:138px;gap:12px;overflow-x:auto;padding-bottom:8px;margin:0 -16px;padding-left:16px;padding-right:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(124px,1fr));gap:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;overflow:hidden;padding:0;text-align:left;width:100%;position:relative;display:block;color:inherit}
.card:active{transform:scale(.965)}
.pw{position:relative;aspect-ratio:2/3;background:var(--panel2);overflow:hidden}
.pw img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.rt{position:absolute;top:8px;right:8px;background:rgba(0,0,0,.72);color:#ffd45e;font-size:11px;font-weight:800;border-radius:7px;padding:3px 7px}
.t{padding:9px 12px 11px;font-size:13px;font-weight:700;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.sk{background:linear-gradient(90deg,var(--panel2) 25%,var(--line) 50%,var(--panel2) 75%);background-size:200% 100%;animation:sh 1.3s linear infinite;border-radius:16px}
@keyframes sh{to{background-position:-200% 0}}
.back{background:none;border:0;color:var(--dim);padding:0;margin:8px 0 12px;font-weight:600}
.muted{color:var(--dim)}
.top{position:relative;border-radius:22px;overflow:hidden;background:#0c0c11;box-shadow:var(--shadow);color:#fff}
.top .bg{position:absolute;inset:-40px;background-size:cover;background-position:center;filter:blur(28px) brightness(.55) saturate(1.5)}
.top .in2{position:relative;display:grid;grid-template-columns:1fr}
.top .pic{aspect-ratio:16/10;position:relative;overflow:hidden}
.top .pic img{width:100%;height:100%;object-fit:contain;position:relative}
.top .dtx{padding:6px 18px 20px}
.top h1{margin:0 0 6px;font-size:25px;line-height:1.12;font-weight:900;font-style:italic}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--panel2);border-radius:999px;padding:6px 14px;font-weight:600}
.chip[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:#fff}
.lbl{font-size:12px;font-weight:700;letter-spacing:.5px;color:var(--dim);margin:18px 0 8px}
.desc{color:var(--dim);font-size:14px}
.eps{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:8px}
.ep{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:11px 0;font-weight:700;position:relative}
.ep.cur{border-color:var(--accent);color:var(--accent)}
.player{background:#000;border-radius:18px;overflow:hidden;aspect-ratio:16/9;position:relative;box-shadow:var(--shadow)}
video{width:100%;height:100%;display:block}
.msg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:20px;color:#fff;background:rgba(0,0,0,.7);pointer-events:none}
.msg button{pointer-events:auto}
.buf{position:absolute;top:10px;left:10px;background:rgba(0,0,0,.65);color:#fff;font-size:12px;padding:4px 10px;border-radius:999px;display:none;pointer-events:none}
.nextbar{display:flex;gap:10px;margin-top:12px}
.nextbar .pri{flex:1;padding:14px 18px;font-size:16px}
.cbar{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:10px 12px;margin-top:12px;display:grid;gap:10px}
.crow{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.seekgrp{display:flex;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--panel2)}
.sb{background:none;border:0;padding:8px 0;width:54px;font-weight:700;font-size:13px}.sb+.sb{border-left:1px solid var(--line)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:12px 14px;margin-top:14px}
.chk{display:flex;gap:10px;align-items:center}
.cd{position:absolute;right:12px;bottom:56px;background:rgba(0,0,0,.8);color:#fff;border-radius:14px;padding:12px 14px;display:grid;gap:8px;font-size:14px;z-index:2}
.cd div{display:flex;gap:8px}.cd button{background:rgba(255,255,255,.18);border:0;color:#fff;border-radius:10px;padding:7px 12px}.cd .go{background:var(--accent)}
.so{position:fixed;inset:0;z-index:20;background:var(--bg);display:flex;flex-direction:column}
.sobar{display:flex;gap:10px;align-items:center;padding:calc(10px + env(safe-area-inset-top)) 16px 10px}
.sobar button{background:none;border:0;color:var(--accent);font-weight:700}
.sobody{flex:1;overflow-y:auto;padding:4px 16px 40px}
.state{padding:60px 16px;text-align:center;color:var(--dim)}
.spill{white-space:nowrap;overflow:hidden;font-size:14px}.spill svg{flex:0 0 auto}.spill span{overflow:hidden;text-overflow:ellipsis}
.player:fullscreen{border-radius:0;aspect-ratio:auto;width:100%;height:100%}.player:-webkit-full-screen{border-radius:0;aspect-ratio:auto;width:100%;height:100%}
video::-webkit-media-controls-fullscreen-button{display:none!important}
video::cue{font-size:1.1em;background:rgba(0,0,0,.65);color:#fff}
.sels{display:grid;grid-template-columns:1fr 1fr;gap:10px}.fld{display:grid;gap:4px;font-size:11px;color:var(--dim);font-weight:700;min-width:0}.fld select{width:100%}
.spill{height:40px;padding:0 14px;font-size:13px;line-height:1;gap:8px;flex:1 1 0;min-width:0;max-width:none}.spill span{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ib{width:40px;height:40px;font-size:16px}.logo{font-size:19px}header{padding-top:calc(8px + env(safe-area-inset-top));padding-bottom:8px;gap:8px}

/* ---- compact layout: card sizes, slim hero, all screen sizes ---- */
.hero{min-height:0;height:clamp(190px,52vw,340px);margin:6px 0 6px;border-radius:18px}
.hero .bg{transform:scale(1.15);filter:blur(22px) brightness(.62) saturate(1.2)}
.hero .art{top:12%;right:14px;height:62%;width:auto;border-radius:10px}
.hin{padding:16px 16px 14px}
.hero h1{margin:4px 0 2px;font-size:clamp(17px,5.4vw,30px);line-height:1.12}
.hero:not(.land) h1{max-width:calc(100% - 96px)}
.hero .row2{margin-top:8px;gap:8px}
.hero .pri,.hero .glass{padding:8px 16px;font-size:13px;border-radius:12px;box-shadow:none}
.seg{top:10px}.seg i{height:3px}
.frail{display:flex;gap:12px;overflow-x:auto;margin:0 -16px;padding:2px 16px 8px;scroll-snap-type:x proximity}
.ftile{position:relative;flex:0 0 auto;width:clamp(118px,33vw,190px);aspect-ratio:512/276;border-radius:14px;overflow:hidden;border:1px solid var(--line);background:var(--panel2);padding:0;scroll-snap-align:start;color:#fff}
.ftile img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.ftile span{position:absolute;left:0;right:0;bottom:0;padding:22px 10px 8px;font-weight:800;font-size:14px;text-align:left;background:linear-gradient(transparent,rgba(0,0,0,.78))}
.ftile:active{transform:scale(.96)}
.ftile.fall{background:linear-gradient(135deg,var(--accent),var(--accent2));display:flex;align-items:center;justify-content:center;border:0}
.ftile.fall span{position:static;background:none;padding:0;text-align:center;font-size:15px}
.cwrap{display:flex;flex-wrap:wrap;gap:8px}
h2.sec{font-size:17px;margin:20px 0 10px}
.sec-row{margin:20px 0 10px}.sec-row h2{font-size:17px}
.rail{grid-auto-columns:clamp(132px,40vw,200px);gap:12px;padding-bottom:4px}
.grid{grid-template-columns:repeat(auto-fill,minmax(clamp(150px,44vw,220px),1fr));gap:12px}
.card{border-radius:12px}
.t{padding:8px 10px 10px;font-size:14px;font-weight:600;line-height:1.3}
.rt{top:6px;right:6px;font-size:12px;padding:3px 7px;border-radius:7px}.bd{font-size:11px}
.skc{height:clamp(200px,58vw,300px)}
.top h1{font-size:22px}
.fsb{position:absolute;z-index:3;top:calc(10px + env(safe-area-inset-top));right:calc(10px + env(safe-area-inset-right));width:38px;height:38px;border-radius:50%;border:1px solid rgba(255,255,255,.25);background:rgba(0,0,0,.55);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);color:#fff;display:flex;align-items:center;justify-content:center;padding:0;transition:opacity .25s}
.fsb:active{transform:scale(.92)}
.player.idle .fsb{opacity:0;pointer-events:none}
.player:fullscreen .buf,.player:-webkit-full-screen .buf{top:calc(10px + env(safe-area-inset-top));left:calc(10px + env(safe-area-inset-left))}
.dlrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap}

/* ================= smoothness ================= */
.ti{position:relative;width:20px;height:20px;display:block}
.ti svg{position:absolute;top:0;left:0;width:20px;height:20px}
.ti .sun{color:var(--accent2);opacity:0;transform:rotate(-100deg) scale(.3)}
.ti .moon{color:var(--text);opacity:1;transform:none}
:root:not([data-theme="dark"]) .ti .sun{opacity:1;transform:none}
:root:not([data-theme="dark"]) .ti .moon{opacity:0;transform:rotate(100deg) scale(.3)}
.ib{transition:transform .18s ease,border-color .2s}.ib:active{transform:scale(.88)}
.ti svg{transition:transform .55s cubic-bezier(.34,1.56,.64,1),opacity .3s ease}
html.tx,html.tx *,html.tx *::before,html.tx *::after{transition:background-color .35s ease,color .35s ease,border-color .35s ease,fill .35s ease,stroke .35s ease,box-shadow .35s ease!important}
.pri,.glass,.btn,.chip,.ep,.sb,.spill{transition:transform .12s,background-color .2s,border-color .2s,color .2s,box-shadow .2s}
.btn:active,.chip:active,.ep:active,.glass:active,.spill:active{transform:scale(.96)}
.nav button{transition:color .2s}.nav button:active{transform:scale(.92)}
.card{transition:transform .15s,border-color .15s,box-shadow .15s}
.card:active{transform:scale(.965);transition-duration:.08s}
.rail{scroll-snap-type:x proximity;scroll-padding-left:16px;overscroll-behavior-x:contain;-webkit-overflow-scrolling:touch}
.rail>*{scroll-snap-align:start}
.hero{touch-action:pan-y;-webkit-user-select:none;user-select:none}
.seg button{flex:1;height:4px;padding:0;border:0;border-radius:4px;background:rgba(255,255,255,.35);overflow:hidden}
.seg button i{display:block;flex:none;height:100%;width:0;background:#fff;border-radius:4px}
.seg button.done i{width:100%}
.seg button.on i{animation:segfill linear forwards}
.pw{background:linear-gradient(90deg,var(--panel2) 25%,var(--line) 50%,var(--panel2) 75%);background-size:200% 100%}
.so{overscroll-behavior:contain}.sobody{overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
@keyframes hfade{from{opacity:0}to{opacity:1}}
@keyframes segfill{from{width:0}to{width:100%}}
@keyframes cin{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes pgin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes hup{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:translateY(12px) scale(.96)}to{opacity:1;transform:none}}
@keyframes soin{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
html:not(.lite){scroll-behavior:smooth}
html:not(.lite) #app>*:not(.rail){animation:pgin .32s cubic-bezier(.2,.7,.2,1) backwards}
html:not(.lite) .rail>*{animation:cin .45s cubic-bezier(.2,.7,.2,1) backwards}
html:not(.lite) .rail>*:nth-child(2){animation-delay:.04s}html:not(.lite) .rail>*:nth-child(3){animation-delay:.08s}html:not(.lite) .rail>*:nth-child(4){animation-delay:.12s}html:not(.lite) .rail>*:nth-child(5){animation-delay:.16s}html:not(.lite) .rail>*:nth-child(6){animation-delay:.2s}html:not(.lite) .rail>*:nth-child(n+7){animation-delay:.24s}
html:not(.lite) .hero .bg,html:not(.lite) .hero .art{animation:hfade .45s ease-out}
html:not(.lite) .hero .hin>*{animation:hup .5s cubic-bezier(.2,.7,.2,1) backwards}
html:not(.lite) .hero .hin>*:nth-child(2){animation-delay:.08s}
html:not(.lite) .pw img{opacity:0;transition:opacity .4s ease,transform .5s cubic-bezier(.2,.7,.2,1)}
html:not(.lite) .pw img.ld{opacity:1}
html:not(.lite) .cd{animation:pop .2s ease-out}
html:not(.lite) .so{animation:soin .18s ease-out}
@media(hover:hover){html:not(.lite) .card:hover{transform:translateY(-4px);border-color:var(--accent);box-shadow:0 14px 30px rgba(0,0,0,.35)}
html:not(.lite) .card:hover .pw img{transform:scale(1.06)}
html:not(.lite) .pri:hover{transform:translateY(-2px);box-shadow:0 10px 24px rgba(255,83,48,.45)}}
html.lite *,html.lite *::before,html.lite *::after{animation:none!important;transition:none!important;scroll-behavior:auto!important;backdrop-filter:none!important;-webkit-backdrop-filter:none!important}
html.lite .seg button.on i{width:100%}
@media(prefers-reduced-motion:reduce){.seg button.on i{animation:none;width:100%}}

/* ================= laptop + TV (html.big / html.tv) ================= */
html.big{--P:clamp(24px,3.2vw,64px);--cw:clamp(150px,11.2vw,250px);--pw:min(1280px,calc((100vh - 130px)*1.7778))}

/* ---------- accounts ---------- */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.65);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;z-index:30;padding:16px}

</header>
<main id="app"></main>
<nav class="nav" id="nav"></nav>
<script src="https://cdnjs.cloudflare.com/ajax/libs/hls.js/1.5.13/hls.min.js" crossorigin="anonymous"></script>
<script>
"use strict";
const BASE="",LITE=document.documentElement.classList.contains("lite");
const $app=document.getElementById("app"),$nav=document.getElementById("nav");
const store={get:k=>{try{return localStorage.getItem(k)}catch(e){return null}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}}};
let MID=false,ME=null,PROG=[],SEENSET=new Set(),favs=JSON.parse(store.get("mb_favs")||"[]"),HOME=null,hls=null,timers=[],DET={},HC={},TAB="",TABS=[],SEC={},CAT="all";
function h(t,a,...k){const el=document.createElement(t);for(const[n,v]of Object.entries(a||{})){if(n==="class")el.className=v;else if(n.startsWith("on"))el[n]=v;else if(v===true)el.setAttribute(n,"");else if(v!==false&&v!=null)el.setAttribute(n,v)}for(const c of k.flat())if(c!=null)el.append(c.nodeType?c:document.createTextNode(c));return el}
const api=async(p,body)=>{const o={headers:{}},t=store.get("jf_token");if(t)o.headers.Authorization="Bearer "+t;
  if(body!==undefined){o.method="POST";o.headers["Content-Type"]="application/json";o.body=JSON.stringify(body)}
  const r=await fetch(BASE+p,o);let j=null;
  if(!r.ok){let m="";try{m=(await r.json()).error}catch(e){}const e=new Error(m||r.status);e.status=r.status;throw e}
  return r.json()};
const go=x=>{location.hash=x};
const mount=(...e)=>$app.replaceChildren(...e.flat().filter(Boolean));
function kill(){timers.forEach(clearInterval);timers=[];if(hls){hls.destroy();hls=null}const v=document.querySelector("video");if(v){try{v.pause();v.removeAttribute("src");v.load()}catch(e){}}}
let txT=0;function setTheme(t,anim){const r=document.documentElement;if(anim&&!LITE){r.classList.add("tx");clearTimeout(txT);txT=setTimeout(()=>r.classList.remove("tx"),480)}r.dataset.theme=t;store.set("theme",t);const m=document.querySelector('meta[name="theme-color"]');if(m)m.content=t==="dark"?"#0a0a0d":"#f5f3ef"}
setTheme(store.get("theme")||"dark");
document.getElementById("theme").onclick=()=>setTheme(document.documentElement.dataset.theme==="dark"?"light":"dark",true);

const IC={mid:'<path d="M20 14.5A8 8 0 0 1 9.5 4 8 8 0 1 0 20 14.5z"/>',disc:'<circle cx="12" cy="12" r="9"/><path d="M15.5 8.5l-2 5-5 2 2-5z"/>',home:'<path d="M3 11l9-8 9 8"/><path d="M5 10v10h5v-6h4v6h5V10"/>',search:'<circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/>',acct:'<circle cx="12" cy="8" r="4"/><path d="M4 21c1-4.5 4-6 8-6s7 1.5 8 6"/>',list:'<path d="M12 21s-7-4.6-9.3-9.2C1.2 8.6 3 5 6.4 5c2 0 3.6 1.2 5.6 3.4C14 6.2 15.6 5 17.6 5 21 5 22.8 8.6 21.3 11.8 19 16.4 12 21 12 21z"/>'};
function drawNav(){const cur=location.hash.replace(/^#\/?/,"").split("/")[0];
  const it=[["home","Home",()=>go("#/")],["disc","Discover",()=>go("#/discover")],...(MID?[["midnight","Midnight",()=>go("#/midnight")]]:[]),["list","My List",()=>go("#/list")],["acct",ME?ME.username:"Account",()=>ME?accountModal():authModal()]];
  $nav.replaceChildren(...it.map(([k,l,f])=>{const b=h("button",{class:(k==="home"&&!["list","show","watch","discover","midnight"].includes(cur))||k===cur?"on":"",onclick:f},l);b.insertAdjacentHTML("afterbegin",'<svg viewBox="0 0 24 24">'+IC[k]+"</svg>");return b}))}

/* ---------- cards ---------- */
const img=(src,cls)=>{const i=h("img",{class:cls||"",src:src||"",referrerpolicy:"no-referrer",loading:"lazy",decoding:"async",alt:"",onerror:e=>e.target.style.display="none"});i.onload=()=>i.classList.add("ld");if(i.complete&&i.naturalWidth)i.classList.add("ld");return i};
const open=i=>go("#/show/"+i.slug+"/"+i.subject_id);
const card=i=>h("button",{class:"card",onclick:()=>open(i)},h("div",{class:"pw"},img(i.poster_url),i.badge?h("div",{class:"bd"},i.badge):null,i.rating?h("div",{class:"rt"},"★ "+i.rating):null),h("div",{class:"t"},i.name||""));
const railBox=items=>{const r=h("div",{class:"rail"},items.map(card)),w=h("div",{class:"rw at0"},r);
  const mk=d=>h("button",{class:"rb "+(d<0?"l":"r"),"aria-label":d<0?"Previous":"Next",tabindex:"-1",onclick:()=>r.scrollBy({left:d*r.clientWidth*.85,behavior:"smooth"})},d<0?"‹":"›");
  w.append(mk(-1),mk(1));
  const upd=()=>{w.classList.toggle("at0",r.scrollLeft<8);w.classList.toggle("at1",r.scrollLeft+r.clientWidth>=r.scrollWidth-8)};
  r.addEventListener("scroll",upd,{passive:true});setTimeout(upd,80);return w};
const skRail=()=>[h("h2",{class:"sec"},"\u00a0"),h("div",{class:"rail"},[1,2,3,4].map(()=>h("div",{class:"sk skc"})))];

/* ---------- tabs / sections / All (all driven by the MovieBox API, nothing hardcoded) ---------- */
function tabBar(){if(!TABS.length)return null;
  return h("div",{class:"cats toptabs"},TABS.map((t,k)=>h("button",{class:"cat"+((TAB===""&&k===0)||(TAB&&TAB===t.id)?" on":""),onclick:()=>{TAB=k===0?"":(t.id||"");home()}},t.name)))}
const moreOf=s=>{const m=s.more||{};return{id:String(m.genreTopId||m.rankingId||m.rankId||m.id||m.opId||""),url:m.url||m.jumpUrl||m.path||m.link||"",title:s.section}};
const hasMore=s=>{const m=s.more||{};return!!(m.genreTopId||m.rankingId||m.rankId||m.id||m.opId||m.url||m.jumpUrl||m.path||m.link)||s.items.length>=9};
const SECT={};
function browsePage(pre){
  const st={tab:"2",classify:"All",country:"All",genre:"All",year:"All",sort:"ForYou"};if(pre==="tv")st.tab="5";if(pre==="anime")st.tab="8";
  const pairs=a=>a.map(v=>[v,v]);
  const groups=[
    ["Type","tab",[["Movies","2"],["Dramas & series","5"],["Anime","8"]]],
    ["Language","classify",["All","English dub","French dub","Hindi dub","Bengali dub","Urdu dub","Punjabi dub","Tamil dub","Telugu dub","Malayalam dub","Kannada dub","Arabic dub","Arabic sub","Tagalog dub","Indonesian dub","Russian dub","Kurdish sub","Spanish dub","Spanish sub","SpanishLatam dub"].map(v=>[/^(Arabic|Spanish)/.test(v)?v:v.replace(/ dub$/,""),v])],
    ["Genre","genre",pairs(["All","Action","Adventure","Animation","Biography","Comedy","Crime","Documentary","Drama","Family","Fantasy","Film-Noir","Game-Show","History","Horror","Music","Musical","Mystery","News","Reality-TV","Romance","Sci-Fi","Short","Sport","Talk-Show","Thriller","War","Western","Other"])],
    ["Country","country",pairs(["All","India","United States","United Kingdom","Korea","Japan","China","Bangladesh","Egypt","France","Germany","Indonesia","Iraq","Italy","Ivory Coast","Kenya","Lebanon","Mexico","Morocco","Nigeria","Pakistan","Philippines","Russia","Saudi Arabia","South Africa","Spain","Syria","Thailand","Malaysia","Turkey","Other"])],
    ["Year","year",pairs(["All","2026","2025","2024","2023","2022","2021","2020","2010s","2000s","1990s","1980s","Other"])],
    ["Sort","sort",[["For you","ForYou"],["Hottest","Hottest"],["Latest","Latest"],["Rating","Rating"],["Year","Year"]]]];
  const box=h("div",{});
  const paint=()=>box.replaceChildren(...groups.flatMap(([lbl,key,opts])=>[h("div",{class:"lbl"},lbl.toUpperCase()),
    h("div",{class:"cwrap"},opts.map(([l,v])=>h("button",{class:"cat"+(st[key]===v?" on":""),onclick:()=>{st[key]=v;paint()}},l)))]));
  paint();
  const show=h("button",{class:"pri",style:"width:100%;margin-top:22px",onclick:()=>{
    const tl=st.tab==="5"?"Dramas & series":st.tab==="8"?"Anime":"Movies";
    const title=[tl,st.classify!=="All"?st.classify.replace(/ dub$/,""):"",st.genre!=="All"?st.genre:"",st.country!=="All"?st.country:"",st.year!=="All"?st.year:""].filter(Boolean).join(" · ");
    const query="type=/home/movieFilter&tabId="+st.tab+"&filterType="+JSON.stringify({classify:st.classify,country:st.country,genre:st.genre,sort:st.sort,year:st.year});
    go("#/all/"+encodeURIComponent(JSON.stringify({title,query})))}},"Show results");
  mount(h("button",{class:"back",onclick:()=>history.back()},"← Back"),h("h2",{class:"sec"},"Browse categories"),box,show)}
function filterBlock(s){const tl=s.tabs.filter(t=>t.query);
  return[h("div",{class:"sec-row"},h("h2",{},s.section),h("button",{class:"all",onclick:()=>go("#/browse")},"Browse all ›")),
    h("div",{class:"frail"},tl.map(t=>h("button",{class:"ftile",onclick:()=>go("#/all/"+encodeURIComponent(JSON.stringify({title:t.name,query:t.query})))},t.image?img(t.image):null,h("span",{},t.name))).concat(h("button",{class:"ftile fall",onclick:()=>go("#/browse")},h("span",{},"More ›"))))]}
function secBlock(s){SEC[s.section]=s.items;SECT[s.section]=s.tabs||[];
  const head=h("div",{class:"sec-row"},h("h2",{},s.section),hasMore(s)?h("button",{class:"all",onclick:()=>go("#/all/"+encodeURIComponent(JSON.stringify(moreOf(s))))},"All ›"):null),
    box=h("div",{},railBox(s.items.slice(0,20))),out=[head];
  if(s.tabs&&s.tabs.length){const strip=h("div",{class:"cats sub"});
    const pick=async k=>{[...strip.children].forEach((b,j)=>b.classList.toggle("on",j===k));const t=s.tabs[k];let its=t.items;
      if(!its){box.replaceChildren(h("div",{class:"state"},"Loading…"));try{its=(await api("/more?id="+encodeURIComponent(t.id||"")+"&title="+encodeURIComponent(t.name))).items}catch(e){its=[]}}
      box.replaceChildren(its&&its.length?railBox(its.slice(0,20)):h("div",{class:"state"},"Nothing found."))};
    s.tabs.forEach((t,k)=>strip.append(h("button",{class:"cat"+(k===0?" on":""),onclick:()=>pick(k)},t.name)));out.push(strip)}
  out.push(box);return out}

/* filter queries -> /browse (clean endpoint); anything unknown falls back to /filter */
const BTYPE={"2":"movie","5":"tv","8":"anime"};
function browseUrl(q,page){try{const u=new URLSearchParams(q),t=BTYPE[u.get("tabId")],ft=JSON.parse(u.get("filterType")||"{}");
    if(t){const p=new URLSearchParams({type:t,genre:ft.genre||"All",country:ft.country||"All",year:ft.year||"All",language:ft.classify||"All",sort:ft.sort||"ForYou",page});return"/browse?"+p}}catch(e){}
  return"/filter?query="+encodeURIComponent(q)+"&page="+page}
async function allPage(raw){let m={};try{m=JSON.parse(raw)}catch(e){}
  let page=1,busy=false,done=false,cur={id:m.id||"",url:m.url||"",title:m.title||"",query:m.query||""},gen=0;
  const tabs=SECT[m.title]||[];
  const grid=h("div",{class:"grid"}),st=h("div",{class:"state"},"Loading…"),btn=h("button",{class:"btn",style:"margin:16px auto;display:none"},"Load more");
  const strip=tabs.length?h("div",{class:"cats sub"}):null;
  mount(h("button",{class:"back",onclick:()=>history.back()},"← Back"),h("h2",{class:"sec"},m.title||"All"),strip,grid,st,btn);
  const load=async()=>{if(busy||done)return;busy=true;btn.style.display="none";const g=gen;
    try{const j=await api(cur.query?browseUrl(cur.query,page):"/more?id="+encodeURIComponent(cur.id)+"&url="+encodeURIComponent(cur.url)+"&title="+encodeURIComponent(cur.title)+"&page="+page),it=j.items||[];
      if(g!==gen){busy=false;return}
      if(it.length){it.forEach(i=>grid.append(card(i)));page++;st.textContent="";btn.style.display="block"}
      else{done=true;let fb=cur.items||SEC[cur.title],note="";
        if(!grid.children.length&&cur.query){try{fb=applyFilter(await pool(),cur.query);note="Matches from MovieBox's home feed. The complete filtered list needs a MovieBox login."}catch(e){}}
        if(g!==gen){busy=false;return}
        if(!grid.children.length&&fb&&fb.length){fb.forEach(i=>grid.append(card(i)));st.textContent=note}else st.textContent=grid.children.length?"That's everything.":"The full list for this category is not available."}}
    catch(e){st.textContent="Failed to load."}busy=false};
  const pick=k=>{
    const t=k<0?null:tabs[k];gen++;page=1;busy=false;done=false;grid.replaceChildren();st.textContent="Loading…";
    cur=t?{id:String(t.id||""),url:"",title:t.name,items:t.items,query:t.query||""}:{id:m.id||"",url:m.url||"",title:m.title||"",query:m.query||""};load()};
  if(strip){strip.append(h("button",{class:"cat on",onclick:()=>pick(-1)},"All"));tabs.forEach((t,k)=>strip.append(h("button",{class:"cat",onclick:()=>pick(k)},t.name)));
    [...strip.children].forEach((b,j)=>{const f=b.onclick;b.onclick=()=>{[...strip.children].forEach((x,y)=>x.classList.toggle("on",y===j));f()}})}
  btn.onclick=load;load()}

/* ---------- Movies / TV / Animation tabs (grouped from the home feed) + Services row ---------- */
const CATS=[["all","All"],["movie","Movies"],["tv","TV Series"],["anime","Animation"],["short","Shorts"]];
let POOL=[];
const kindOf=(i,sec)=>{const g=String(i.genre||"");
  if(/anim(e|ation)/i.test(g))return"anime";
  if(i.type==7)return"short";if(i.type==2)return"tv";if(i.type==1)return"movie";
  const s=String(sec||"");
  if(/short/i.test(s))return"short";
  if(/anime|animation/i.test(s))return"anime";
  if(/series|drama|tv\b|show/i.test(s))return"tv";
  if(/movie|cinema|bollywood|hollywood|south/i.test(s))return"movie";
  return"other"};
const catBar=()=>h("div",{class:"cats toptabs"},CATS.map(([k,l])=>h("button",{class:"cat"+(CAT===k?" on":""),onclick:()=>{CAT=k;home()}},l)));
async function pool(){if(POOL.length)return POOL;
  const R=HC[""]||(HC[""]=await api("/home")),seen=new Set();

    if(x.kind==="hls"&&hls&&hls.levels.length>1){const k=hls.autoLevelEnabled?hls.levels.reduce((b,l,i,a)=>l.height>a[b].height?i:b,0):hls.currentLevel,L=hls.levels[k],lu=L&&(L.uri||(L.url&&L.url[0]));
      if(lu){const q=new URL(lu,location.href).searchParams.get("u");if(q)raw=q}}
    const nm=(title+(x.kind==="hls"?"":" "+x.label)).replace(/[^\w\- ]+/g,"").trim().replace(/ +/g,"_")||"video";
    const dl="/dl?u="+encodeURIComponent(raw)+"&name="+encodeURIComponent(nm);
    dlb.disabled=true;dlMsg.textContent="Checking…";
    try{const r=await fetch(dl+"&check=1"),j=await r.json().catch(()=>({}));if(!r.ok||!j.ok)throw new Error(j.error||"Download is not available for this stream.");
      const a=h("a",{href:dl});document.body.append(a);a.click();setTimeout(()=>a.remove(),1000);
      dlMsg.textContent="Download started. Check your browser's downloads. The file will play in VLC or MX Player."}
    catch(e){dlMsg.textContent=e.message}dlb.disabled=false};
  video.onended=()=>{store.set(key,"0");saveProg(true);if(!next||!auto.checked)return;let n=5;const lb=h("span",{},"Next episode in "+n+"s"),bar=h("div",{class:"cd"},lb,h("div",{},h("button",{class:"go",onclick:()=>{clearInterval(t);go(nUrl(next))}},"Play now"),h("button",{onclick:()=>{clearInterval(t);bar.remove()}},"Cancel")));
    box.append(bar);const t=setInterval(()=>{n--;lb.textContent="Next episode in "+n+"s";if(n<=0){clearInterval(t);go(nUrl(next))}},1000);timers.push(t)};
  timers.push(setInterval(()=>{if(!video.paused&&video.currentTime>5)store.set(key,String(video.currentTime))},8000));
  timers.push(setInterval(()=>{if(!video.paused&&video.currentTime>5)saveProg()},10000));video.addEventListener("pause",()=>{if(!video.ended&&video.currentTime>5)saveProg()});
  function play(i){cur=i;tried.add(i);if(hls){hls.destroy();hls=null}msg.style.display="flex";msg.textContent="Loading…";sels.querySelectorAll(".dyn").forEach(x=>x.remove());
    srcSel.replaceChildren(...src.map((s,j)=>h("option",{value:j,selected:j===i},s.label)));
    const x=src[i],hide=()=>{msg.style.display="none";buf.style.display="none"};
    const bad=t=>{msg.style.display="flex";msg.replaceChildren(h("div",{},t||"This stream failed to load.",h("div",{style:"margin-top:12px"},h("button",{class:"chip",onclick:()=>{tried.clear();play(cur)}},"↻ Retry"))))};
    const fb=()=>{const n=src.findIndex((_,j)=>!tried.has(j));if(n<0)return false;msg.textContent="Trying another source…";play(n);return true};
    video.onplaying=hide;video.oncanplay=hide;video.onloadeddata=hide;
    video.onwaiting=()=>{if(msg.style.display!=="flex")buf.style.display="block"};
    video.onloadedmetadata=()=>{if(resume>10){video.currentTime=resume;resume=0}};
    video.onerror=()=>{if(!hls&&!fb())bad()};
    if(x.kind==="hls"&&window.Hls&&Hls.isSupported()){let nt=0,mt=0;
      hls=new Hls({maxBufferLength:30,capLevelToPlayerSize:true,startFragPrefetch:true,manifestLoadingMaxRetry:3,fragLoadingMaxRetry:4});
      hls.loadSource(x.url);hls.attachMedia(video);
      hls.on(Hls.Events.MANIFEST_PARSED,()=>{video.play().catch(hide);
        if(hls.levels.length>1)sels.append(h("label",{class:"fld dyn"},"Resolution",h("select",{onchange:e=>hls.currentLevel=+e.target.value},h("option",{value:-1},"Auto"),hls.levels.map((l,k)=>({l,k})).sort((a,b)=>b.l.height-a.l.height).map(({l,k})=>h("option",{value:k},l.height+"p")))))});
      hls.on(Hls.Events.AUDIO_TRACKS_UPDATED,()=>{if(hls.audioTracks.length>1)sels.append(h("label",{class:"fld dyn"},"Audio track",h("select",{onchange:e=>hls.audioTrack=+e.target.value},hls.audioTracks.map((t,k)=>h("option",{value:k},t.name||t.lang||"Track "+(k+1))))))});
      hls.on(Hls.Events.FRAG_BUFFERED,()=>{nt=0});
      hls.on(Hls.Events.ERROR,(_e,er)=>{if(!er.fatal)return;
        if(er.type===Hls.ErrorTypes.NETWORK_ERROR&&nt++<3){buf.style.display="block";setTimeout(()=>hls&&hls.startLoad(video.currentTime||-1),1500*nt)}
        else if(er.type===Hls.ErrorTypes.MEDIA_ERROR&&mt++<3)hls.recoverMediaError();
        else if(!fb())bad("The stream failed to load. Please try again shortly.")})}
    else{video.src=x.url;video.play().catch(hide)}}
  api("/api/captions/"+id+"?detail_path="+encodeURIComponent(slug)+"&id="+encodeURIComponent((data.cap&&data.cap.id)||"")+"&fmt="+((data.cap&&data.cap.fmt)||"MP4")).then(j=>{if(!mine())return;caps=j.captions||[];
    if(!caps.length){subSel.firstChild.textContent="None available";return}
    caps.forEach(c=>video.append(h("track",{kind:"subtitles",label:c.lang,src:c.url})));
    caps.forEach((c,k)=>subSel.append(h("option",{value:k},c.lang)));
    const k=caps.findIndex(c=>c.lang===store.get("sub"));if(k>=0){subSel.value=k;subSel.onchange()}}).catch(()=>{});
  play(0)}

/* ---------- Discover: rankings (home rows), Upcoming, Live ---------- */
async function discoverPage(){
  const chips=h("div",{class:"cats sub"}),grid=h("div",{class:"grid"}),st=h("div",{class:"state"},"Loading…"),btn=h("button",{class:"btn",style:"margin:16px auto;display:none"},"Load more");
  mount(h("h2",{class:"sec"},"Discover"),chips,grid,st,btn);
  let R;try{R=HC[""]||(HC[""]=await api("/home"))}catch(e){st.textContent="Unable to connect to the server.";return}
  const gid=s=>{const m=s.more||{};return String(m.genreTopId||m.rankingId||m.rankId||m.id||m.opId||"")};
  const src=[...(R.sections||[]).filter(s=>s.section!=="Banner"&&gid(s)).map(s=>({name:s.section,url:"/ranking?id="+encodeURIComponent(gid(s))})),
    {name:"Upcoming",url:"/extra/upcoming?x=1"},{name:"Live",url:"/extra/live?x=1"}];
  let cur=0,page=1,busy=false,done=false,gen=0;
  const load=async()=>{if(busy||done)return;busy=true;btn.style.display="none";const g=gen,u=src[cur].url+(src[cur].url.includes("?")?"&":"?")+"page="+page;
    try{const j=await api(u),it=j.items||[];if(g!==gen){busy=false;return}
      if(it.length){it.forEach(i=>grid.append(card(i)));page++;st.textContent="";btn.style.display="block"}
      else{done=true;st.textContent=grid.children.length?"That's everything.":"Nothing available here right now."}}
    catch(e){st.textContent="Failed to load."}busy=false};
  const pick=k=>{cur=k;gen++;page=1;busy=false;done=false;grid.replaceChildren();st.textContent="Loading…";[...chips.children].forEach((b,j)=>b.classList.toggle("on",j===k));load()};
  src.forEach((t,k)=>chips.append(h("button",{class:"cat"+(k===0?" on":""),onclick:()=>pick(k)},t.name)));
  btn.onclick=load;load()}

/* ---------- Midnight (18+): only shown when the server has ENABLE_MIDNIGHT=1; asks the viewer to confirm they are 18+ ---------- */
async function midnightPage(){
  if(!MID){go("#/");return}
  if(store.get("jf_18")!=="1"){
    mount(h("h2",{class:"sec"},"Midnight (18+)"),h("div",{class:"state"},"This section contains adult content. You must be 18 or older to continue."),
      h("div",{style:"display:flex;gap:10px;justify-content:center;margin-top:12px"},
        h("button",{class:"pri",onclick:()=>{store.set("jf_18","1");midnightPage()}},"I am 18 or older"),
        h("button",{class:"btn",onclick:()=>go("#/")},"Go back")));return}
  mount(h("h2",{class:"sec"},"Midnight (18+)"),h("div",{class:"state"},"Loading…"));
  let R;try{R=await api("/midnight")}catch(e){mount(h("h2",{class:"sec"},"Midnight (18+)"),h("div",{class:"state"},"Midnight is not available right now."));return}
  const secs=(R.sections||[]).filter(s=>s.section!=="Banner"&&s.items&&s.items.length);
  mount(h("h2",{class:"sec"},"Midnight (18+)"),secs.length?secs.map(s=>secBlock(s)).flat():h("div",{class:"state"},"Nothing found."))}
function route(){kill();$app.classList.remove("w");const p=location.hash.replace(/^#\/?/,"").split("/").filter(Boolean).map(decodeURIComponent);drawNav();scrollTo({top:0,left:0,behavior:"instant"});
  if(p[0]==="show")return show(p[1],p[2]);if(p[0]==="watch")return watch(p[1],p[2],p[3]||0,p[4]||0);if(p[0]==="list")return listPage();if(p[0]==="discover")return discoverPage();if(p[0]==="midnight")return midnightPage();if(p[0]==="all")return allPage(p[1]);if(p[0]==="browse")return browsePage(p[1]);home()}
