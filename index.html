<style>
:root{color-scheme:light;--bg:#f4f5f8;--panel:#fff;--panel2:#ebedf2;--line:#dfe2e8;--text:#17181f;--dim:#6b6f7d;--accent:#0071e3;--accent2:#2f8cf0;--green:#22c993;--glass:rgba(244,245,248,.88);--shadow:0 6px 22px rgba(20,20,30,.08);--glow:rgba(0,113,227,.2)}
:root[data-theme="dark"]{color-scheme:dark;--bg:#08090c;--panel:#131419;--panel2:#1b1c23;--line:#272932;--text:#f4f2f5;--dim:#a29da6;--accent:#0a84ff;--accent2:#4aa3ff;--green:#2fd6a1;--glass:rgba(8,9,12,.88);--shadow:0 8px 26px rgba(0,0,0,.5);--glow:rgba(10,132,255,.22)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{overflow-x:hidden}
html,body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 "Poppins",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
select{color:var(--text)}
.in::placeholder{color:var(--dim);opacity:1}
input:-webkit-autofill{-webkit-box-shadow:0 0 0 100px var(--panel2) inset;-webkit-text-fill-color:var(--text);caret-color:var(--text)}
html.lock,html.lock body{overflow:hidden}
header{position:sticky;top:0;z-index:5;background:var(--glass);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);padding:calc(10px + env(safe-area-inset-top)) 16px 10px;display:flex;gap:10px;align-items:center}
.logo{font-weight:900;font-style:italic;font-size:21px;cursor:pointer;white-space:nowrap;letter-spacing:-.5px;text-transform:uppercase}
.logo b{background:linear-gradient(90deg,var(--accent),var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent;padding-right:3px}
.in,select{background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:10px 16px;outline:0}
.in:focus,select:focus{border-color:var(--accent)}
select{border-radius:12px;padding:9px 12px}
#q{flex:1;min-width:0}
.ib{background:var(--panel);border:1px solid var(--line);border-radius:50%;width:42px;height:42px;padding:0;display:flex;align-items:center;justify-content:center;flex:0 0 auto;transition:transform .18s ease,border-color .2s}
.ib:active{transform:scale(.88)}
.ti{position:relative;display:block;width:20px;height:20px}
.ti svg{position:absolute;top:0;left:0;width:20px;height:20px;transition:transform .55s cubic-bezier(.34,1.56,.64,1),opacity .3s ease}
.ti .sun{color:var(--accent2);opacity:0;transform:rotate(-100deg) scale(.3)}
.ti .moon{color:var(--text);opacity:1;transform:none}
:root:not([data-theme="dark"]) .ti .sun{opacity:1;transform:none}
:root:not([data-theme="dark"]) .ti .moon{opacity:0;transform:rotate(100deg) scale(.3)}
html.tx,html.tx *,html.tx *::before,html.tx *::after{transition:background-color .35s ease,color .35s ease,border-color .35s ease,fill .35s ease,stroke .35s ease,box-shadow .35s ease!important}
.pri{background:linear-gradient(135deg,var(--accent),var(--accent2));border:0;color:#fff;font-weight:700;border-radius:14px;padding:12px 24px;box-shadow:0 6px 18px rgba(10,132,255,.35);transition:transform .12s}
.pri:active{transform:scale(.97)}
.btn{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:9px 16px}
main{max-width:1180px;margin:0 auto;padding:6px 16px calc(var(--nh,70px) + 28px);min-height:70vh}
html{scroll-padding-bottom:calc(var(--nh,70px) + 16px)}
.ep,.card{scroll-margin-bottom:calc(var(--nh,70px) + 16px)}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--glass);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
.nav button{background:none;border:0;color:var(--dim);display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:600;padding:4px 0;border-radius:12px;flex:1 1 0;min-width:0;transition:color .2s}
.nav button svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.nav button.on{color:var(--accent)}
.dots{position:absolute;right:16px;top:16px;display:flex;gap:5px}
.dots i{width:6px;height:6px;border-radius:6px;background:rgba(255,255,255,.4);transition:width .25s}
.dots i.on{background:var(--accent);width:20px}
.row2{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}
.glass{background:rgba(255,255,255,.14);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);color:#fff;border:1px solid rgba(255,255,255,.18);border-radius:14px;padding:12px 20px;font-weight:600}
.see{background:none;border:0;color:var(--accent);font-size:13px;font-weight:700}
.ep.seen{opacity:.55}
.ep.seen::before{content:"✓";position:absolute;top:2px;left:6px;font-size:10px;color:var(--accent)}
.countdown{position:absolute;right:12px;bottom:56px;background:rgba(0,0,0,.8);color:#fff;border-radius:14px;padding:12px 14px;display:grid;gap:8px;font-size:14px;z-index:2}
.countdown div{display:flex;gap:8px}
.countdown button{background:rgba(255,255,255,.18);border:0;color:#fff;border-radius:10px;padding:7px 12px}
.countdown .go{background:var(--accent)}
.chk{display:flex;gap:10px;align-items:center}
.sub{font-size:12px;color:var(--dim)}
/* hero */
.hero{position:relative;border-radius:22px;overflow:hidden;min-height:372px;display:flex;align-items:flex-end;margin:8px 0 12px;background:var(--panel2);box-shadow:var(--shadow)}
.hero{touch-action:pan-y;user-select:none;-webkit-user-select:none}
.hero .bg{position:absolute;inset:0;background-size:cover;background-position:center 20%;transform:scale(1.25);filter:blur(26px) brightness(.62) saturate(1.2);animation:hfade .45s ease-out}
.hero.land .bg{transform:scale(1.02);filter:none}
.hero .art{position:absolute;z-index:1;right:18px;top:44px;height:122px;width:auto;max-width:36%;border-radius:12px;object-fit:cover;box-shadow:0 10px 30px rgba(0,0,0,.55);animation:hfade .45s ease-out}
.hero.land .art{display:none}

.seg{position:absolute;left:16px;right:16px;top:12px;z-index:3;display:flex;gap:5px}
.seg button{flex:1;height:4px;padding:0;border:0;border-radius:4px;background:rgba(255,255,255,.35);overflow:hidden}
.seg i{display:block;height:100%;width:0;background:#fff;border-radius:4px}

.seg .on i{animation:segfill linear forwards}
@keyframes segfill{from{width:0}to{width:100%}}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.05) 0%,rgba(0,0,0,.25) 35%,rgba(10,10,13,.94) 100%)}
.hero .hin{position:relative;z-index:1;padding:36px 18px 20px;color:#fff;width:100%}
.hero .in2{min-width:0;max-width:620px}
.hero h1{margin:8px 0 4px;font-size:28px;line-height:1.08;font-weight:900;font-style:italic;letter-spacing:-.5px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;text-shadow:0 2px 14px rgba(0,0,0,.5)}
.hero .hg{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 0}
.hero .hg span{font-size:11px;font-weight:700;color:#fff;background:rgba(255,255,255,.18);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);border:1px solid rgba(255,255,255,.22);border-radius:999px;padding:4px 10px;line-height:1}
.hero .hd{margin:8px 0 0;font-size:13px;line-height:1.45;color:#eceef5;font-weight:500;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;text-shadow:0 1px 8px rgba(0,0,0,.5)}
.hero .hd.open{-webkit-line-clamp:unset;display:block;overflow:visible}
.hero .hmore{background:none;border:0;color:#fff;font-weight:800;font-size:12.5px;padding:4px 0 0;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.hero.hold .seg .on i{animation-play-state:paused}
.hero .meta{font-size:13px;color:#e4e6ee;font-weight:500}
.hero .pri,.hero .glass{padding:11px 22px;font-size:15px}
.hero .pri{flex:1 1 0;max-width:220px}
.hero .glass{flex:1 1 0;max-width:180px}
.ept{padding:0;font-size:11px;font-weight:700;color:var(--accent);margin-bottom:2px}
.ept span{color:var(--dim);font-weight:500}
.tag{display:inline-block;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border-radius:8px;padding:4px 11px;font-size:11px;font-weight:800;letter-spacing:.6px;text-transform:uppercase}
h2.sec{font-size:19px;font-weight:800;margin:26px 0 12px;display:flex;justify-content:space-between;align-items:center;letter-spacing:-.2px}
/* rails & grid: wide, short thumbnails */
.rail{display:grid;grid-auto-flow:column;grid-auto-columns:236px;gap:12px;overflow-x:auto;padding-bottom:8px;scrollbar-width:none;scroll-snap-type:x proximity;scroll-padding-left:16px;margin:0 -16px;padding-left:16px;padding-right:16px}

.rail>*{scroll-snap-align:start}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;overflow:hidden;padding:0;text-align:left;width:100%;position:relative;transition:transform .15s,border-color .15s,box-shadow .15s;display:block}

.card:active{transform:scale(.965);transition-duration:.08s}
.pw{position:relative;aspect-ratio:16/9;width:100%;overflow:hidden;background:var(--panel2)}
.pw .poster,.pw .ph{position:absolute;top:0;right:0;bottom:0;left:0;width:100%;height:100%;display:block;object-fit:cover;object-position:center 22%}
.pw .ph{display:flex;align-items:center;justify-content:center}
.pw .bgb{position:absolute;top:-12px;right:-12px;bottom:-12px;left:-12px;background-size:cover;background-position:center;filter:blur(16px) brightness(.62) saturate(1.2);display:none}
.pw.ptr .bgb{display:block}
.pw.ptr .poster{object-fit:contain;object-position:center}
.ph{display:flex;align-items:center;justify-content:center;font-size:38px;font-weight:900;color:var(--accent);background:linear-gradient(135deg,var(--panel2),var(--panel))}
.ov{position:absolute;left:0;right:0;bottom:0;display:flex;align-items:flex-end;gap:6px;padding:18px 8px 7px;background:linear-gradient(180deg,transparent,rgba(0,0,0,.7));pointer-events:none}

.badge{position:absolute;top:8px;left:8px;background:var(--green);color:#04130e;font-size:10.5px;font-weight:900;letter-spacing:.5px;border-radius:7px;padding:3px 9px}
.prog{height:4px;background:var(--line)}

.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;position:sticky;top:var(--hh,62px);z-index:4;background:var(--bg);padding:8px 0}
.tab{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:7px 16px;font-weight:600}

.back{background:none;border:0;color:var(--dim);padding:0;margin:8px 0 12px;font-weight:600}
/* detail */
.top{position:relative;border-radius:22px;overflow:hidden;padding:0;margin-bottom:6px;background:#0c0c11;box-shadow:var(--shadow)}
.top .bg{position:absolute;top:-40px;right:-40px;bottom:-40px;left:-40px;background-size:cover;background-position:center;filter:blur(28px) brightness(.55) saturate(1.5)}

.ep{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:11px 0;font-weight:700;position:relative;display:flex;align-items:center;justify-content:center;white-space:nowrap}
.ep:hover,.ep.cur{border-color:var(--accent);color:var(--accent)}
.ep.cur::after{content:"●";position:absolute;top:2px;right:6px;font-size:8px}
.player{background:#000;border-radius:18px;overflow:hidden;aspect-ratio:16/9;position:relative;box-shadow:var(--shadow)}
video{width:100%;height:100%;display:block}
.msg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:20px;color:#fff;background:rgba(0,0,0,.7)}
.buf{position:absolute;top:10px;left:10px;background:rgba(0,0,0,.65);color:#fff;font-size:12px;padding:4px 10px;border-radius:999px;display:none;pointer-events:none}
.epbox{margin-top:8px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:14px;margin-top:14px;display:grid;gap:12px}
.lbl{font-size:12px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--dim);margin-bottom:6px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--panel2);border-radius:999px;padding:6px 14px;font-weight:600}

.seekrow{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}

.sels{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.sels select{width:100%}
.dl{height:6px;background:var(--line);border-radius:6px;overflow:hidden}
.dl i{display:block;height:100%;width:0;background:var(--accent)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.65);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;z-index:9;padding:16px}

.box>*{min-width:0;max-width:100%}
.box .in,.box .pri,.box .btn,.box .back{display:block;width:100%}
.box .in{background:var(--panel2);font-size:16px}
.box .in:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(10,132,255,.16)}
.box .back{text-align:center;padding:6px 0;margin:0;white-space:normal}
.box .pri{padding:13px 16px}
.err{color:var(--accent);font-size:13px;min-height:1em}
.tvbox{max-width:760px!important;text-align:center}
.tvrow{display:flex;gap:30px;align-items:center;justify-content:center;flex-wrap:wrap}
.tvqr{background:#fff;border-radius:14px;min-width:200px;min-height:200px;display:flex;align-items:center;justify-content:center;color:#555}
.tvside{font-size:20px;line-height:1.7;text-align:left;max-width:300px}
.tvcode{font-size:42px;font-weight:800;letter-spacing:9px;margin-top:10px}
.tvnote{font-size:15px;color:var(--dim);text-align:center;min-height:1.2em}
footer{text-align:center;color:var(--dim);font-size:13px;padding:30px 16px 96px}

.spill{flex:1;min-width:0;display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:10px 16px;color:var(--dim);text-align:left}

.spill svg{flex:0 0 auto}
.so{position:fixed;top:0;right:0;bottom:0;left:0;z-index:20;overscroll-behavior:contain;background:var(--bg);display:flex;flex-direction:column;animation:soin .18s ease-out}
@keyframes soin{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.sobar{display:flex;gap:10px;align-items:center;padding:calc(10px + env(safe-area-inset-top)) 16px 10px}

.socancel{background:none;border:0;color:var(--accent);font-weight:700;padding:8px 2px}
.sobody{padding-bottom:calc(40px + env(safe-area-inset-bottom))!important;flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;scrollbar-width:none;padding:4px 16px 40px;max-width:720px;width:100%;margin:0 auto}
.sobody::-webkit-scrollbar{display:none;width:0;height:0}
.sohd{display:flex;justify-content:space-between;align-items:center;margin:16px 0 10px;font-size:13px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;color:var(--dim)}
.sohd button{background:none;border:0;color:var(--accent);font-size:12px;font-weight:700;text-transform:none;letter-spacing:0}
.rec{display:flex;flex-wrap:wrap;gap:8px}

.sr{display:flex;gap:12px;align-items:center;width:100%;background:none;border:0;border-radius:14px;padding:8px;text-align:left}
.sr:hover,.sr:active{background:var(--panel)}

.sr .pw{border-radius:10px}
.sr .ph{font-size:22px}

@keyframes shim{from{background-position:120% 0}to{background-position:-120% 0}}
html.lite .pw:not(.ok){animation:none}
.pw .poster{opacity:0;transition:transform .5s cubic-bezier(.2,.7,.2,1),opacity .45s ease}
.pw.ok .poster{opacity:1}
.t small.lf{color:var(--accent);font-weight:700}
.hero .row2 .glass.sh{flex:0 0 54px;padding:0;font-size:22px;line-height:1}
.toast{position:fixed;left:50%;bottom:calc(var(--nh,70px) + 24px);transform:translateX(-50%);z-index:40;background:rgba(20,18,22,.94);color:#fff;font-weight:700;font-size:14px;padding:11px 20px;border-radius:999px;box-shadow:0 10px 30px rgba(0,0,0,.4);animation:tin .28s cubic-bezier(.2,.8,.2,1);transition:opacity .35s}
.toast.out{opacity:0}
@keyframes tin{from{opacity:0;transform:translate(-50%,12px)}}
.inst{position:fixed;left:12px;right:12px;bottom:calc(var(--nh,70px) + 10px);z-index:12;display:flex;align-items:center;gap:12px;max-width:520px;margin:0 auto;padding:12px 12px 12px 14px;background:var(--panel);border:1px solid var(--line);border-radius:20px;box-shadow:0 16px 44px var(--glow),var(--shadow);animation:pvs .4s cubic-bezier(.2,.8,.2,1)}
.inst .ii{flex:0 0 42px;height:42px;border-radius:14px;display:grid;place-items:center;font-size:20px;font-weight:900;background:var(--accent);color:#170904}
.inst .it{flex:1;min-width:0}
.inst .it b{display:block;font-size:14px}
.inst .it small{display:block;color:var(--dim);font-size:12px;line-height:1.3}
.inst .pri{padding:10px 16px;border-radius:14px;font-size:14px;box-shadow:none}
.inst .x{background:none;border:0;color:var(--dim);font-size:22px;line-height:1;padding:4px 6px}
/* --- speed pass: cheaper paint on phones --- */
header,.nav{backdrop-filter:none!important;-webkit-backdrop-filter:none!important;background:var(--bg)!important}
.hero .bg,.top .bg{filter:none!important;transform:none!important;opacity:.55}
.ep,.card{content-visibility:auto;contain-intrinsic-size:auto 72px}
.card{contain-intrinsic-size:auto 260px}
.ep.epc{transition:none}
img.poster{content-visibility:auto}
html:not(.lite) #app>*:not(.rail){animation-duration:.18s!important}
html:not(.lite) .rail>*{animation:none!important}
/* ===== PC (wide screens): Apple TV style cards, 2-column show page, centred player ===== */
@media(min-width:760px){
.card{background:none!important;border:0!important;box-shadow:none!important;overflow:visible;border-radius:0}
.card .pw{border-radius:16px;box-shadow:0 10px 26px rgba(0,0,0,.35)}
.card .t{padding:10px 2px 0;font-size:14.5px;font-weight:600;color:var(--text)}
h2.sec{font-size:24px;margin:34px 0 14px;padding-left:0}h2.sec::before{display:none}
.rail{gap:18px}.grid{gap:22px 18px}
.hero:not(.dh) .hban{border-radius:26px;box-shadow:none;border:0}
.hero:not(.dh) .pri,.hero:not(.dh) .glass,.hero.dh .row2 .pri,.hero.dh .row2 .glass{border-radius:999px}
}
@media(min-width:900px){
.rail{grid-auto-columns:clamp(260px,19vw,340px)}
.t10r{grid-auto-columns:clamp(300px,24vw,380px)}
.hero.dh{display:grid;grid-template-columns:minmax(320px,42%) 1fr;gap:36px;align-items:start}
.hero.dh .hban{aspect-ratio:16/10}
.hero.dh .hin{padding:6px 0 0}
.hero.dh h1{font-size:clamp(32px,3.2vw,46px)}
.hero.dh .hd,.hero.dh .hd:not(.open){-webkit-line-clamp:5;font-size:15.5px}
.eps.epl{grid-template-columns:repeat(2,1fr);gap:12px}
#app>.back,#app>h2:not(.sec),.player,.nextbar,.cbar,.panel.slim,.epbox{max-width:1000px;margin-left:auto;margin-right:auto}
.player{width:100%}
.cbar{margin-top:16px}.crow{grid-template-columns:1fr 1fr}
.seekgrp{max-width:420px}
}
@media(min-width:1500px){.eps.epl{grid-template-columns:repeat(3,1fr)}.rail{grid-auto-columns:clamp(280px,17vw,360px)}}
@media(hover:hover){.card:hover .pw{transform:translateY(-4px);box-shadow:0 16px 36px var(--glow,rgba(0,0,0,.5))}.card .pw{transition:transform .2s,box-shadow .2s}}
/* ===== TV (html.tv, remote control): big text, safe margins, clear focus ring ===== */
html.tv{font-size:20px}
html.tv header{padding:16px 56px}
html.tv main{max-width:none;padding-left:56px;padding-right:56px}
html.tv .logo{font-size:30px}
html.tv .ib,html.tv .spill{height:56px}
html.tv .ib{width:56px}
html.tv .spill{font-size:18px}
html.tv h2.sec{font-size:30px;margin:38px 0 16px}
html.tv .rail{grid-auto-columns:clamp(300px,21vw,420px);gap:24px;padding-top:16px;padding-bottom:26px}
html.tv .card .t{font-size:18px;padding-top:12px}
html.tv .card:focus,html.tv .ep:focus,html.tv .sr:focus{transform:none;box-shadow:none;outline:0}
html.tv .card .pw{transition:transform .15s}
html.tv .card:focus .pw{transform:scale(1.07);outline:5px solid var(--accent);outline-offset:4px;box-shadow:0 18px 40px rgba(0,0,0,.6)}
html.tv .hero:not(.dh) .hban{aspect-ratio:21/8;max-height:46vh}
html.tv .hero h1{font-size:46px}
html.tv .hero .hd{font-size:19px}
html.tv .pri,html.tv .glass,html.tv .btn,html.tv .chip{min-height:56px;font-size:19px;padding-left:28px;padding-right:28px}
html.tv .epc .et{font-size:19px}
html.tv .epc .es{font-size:14px}
html.tv .epc .eth{flex-basis:160px}
html.tv .ep:focus{outline:4px solid var(--accent);outline-offset:3px;background:color-mix(in srgb,var(--accent) 14%,var(--panel))}
html.tv .nav{padding:8px 24px}
html.tv .nav button{font-size:16px;padding:8px 0}
html.tv .nav svg{width:30px;height:30px}
html.tv .sb{font-size:17px;height:52px}
html.tv .csel select{height:52px;font-size:17px}
html.tv .nextbar .pv,html.tv .nextbar .nx{height:58px;font-size:19px}
/* --- watch (player) screen, Apple TV style --- */
.player{border-radius:20px;box-shadow:0 10px 30px rgba(0,0,0,.4)}
.cbar{background:none;border:0;padding:0;gap:12px;margin-top:14px}
.crow{display:grid;grid-template-columns:1fr;gap:10px}
.seekgrp{display:grid;grid-template-columns:repeat(4,1fr);border-radius:999px;height:44px}
.sb{width:auto;height:44px;padding:0;font-size:13.5px}
.csel{margin-left:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px}
.csel select{width:100%;max-width:none;height:42px;border-radius:999px;padding:0 14px}
.cbar>.sub{text-align:center;font-size:12px}
.nextbar{gap:10px;margin-top:14px}
.nextbar .pv{height:48px;border-radius:999px;padding:0 20px}
.nextbar .nx{height:48px;padding:0 18px;border-radius:999px;font-size:15px;font-weight:800}
.panel.slim{background:none;border:0;border-top:1px solid var(--line);border-radius:0;padding:14px 2px 0;margin-top:16px}
.panel.slim .btn{width:100%;height:46px;border-radius:999px;font-weight:700}
.player+.nextbar{margin-top:14px}
/* --- Apple TV style (phones): big clean 16:9 cards, title below, soft corners, lots of air --- */
@media(max-width:759px){
.rail{grid-auto-columns:min(272px,76vw);gap:14px}
.t10r{grid-auto-columns:min(290px,80vw)}
.card{background:none!important;border:0!important;box-shadow:none!important;overflow:visible;border-radius:0}
.card .pw{border-radius:14px;box-shadow:0 8px 22px rgba(0,0,0,.32)}
.card:active .pw{transform:scale(.97)}
.card .t{padding:9px 2px 0;font-size:13.5px;font-weight:600;line-height:1.3;color:var(--text)}
h2.sec{font-size:21px;font-weight:800;margin:28px 0 12px;padding-left:0;letter-spacing:-.3px}
h2.sec::before{display:none}
.grid{gap:16px 12px}
.hero:not(.dh){margin:6px 0 4px}
.hero:not(.dh) .hban{aspect-ratio:16/11;border-radius:22px;box-shadow:none;border:0}
.hero:not(.dh) .hin{padding:14px 4px 0}
.hero:not(.dh) .in2{text-align:center}
.hero:not(.dh) .kick,.hero:not(.dh) .hg,.hero:not(.dh) .hd,.hero:not(.dh) .hmore{display:none}
.hero:not(.dh) h1{margin:0 0 6px;font-size:clamp(22px,6.4vw,28px);-webkit-line-clamp:2}
.hero:not(.dh) .hinfo{justify-content:center;margin:0 0 10px}
.hero:not(.dh) .row2{justify-content:center;gap:10px;margin-top:6px}
.hero:not(.dh) .pri,.hero:not(.dh) .glass{height:48px;border-radius:999px;font-size:15px}
.hero:not(.dh) .seg{justify-content:center;margin:14px 0 0}
}
/* --- show page: title, description, action buttons --- */
.hero.dh h1{font-size:clamp(24px,7vw,32px);line-height:1.1;margin:12px 0 8px;-webkit-line-clamp:3}
.hero.dh .hinfo{margin:0 0 10px}
.hero.dh .hd:not(.open){-webkit-line-clamp:3;font-size:14px;line-height:1.5}
.hero.dh .hd.open{font-size:14px;line-height:1.55}
.hero.dh .hmore{display:block;margin-top:6px;padding:2px 0}
.hero.dh .row2{display:flex;flex-wrap:nowrap;align-items:stretch;gap:10px;margin-top:16px}
.hero.dh .row2 .pri{flex:1 1 auto;min-width:0;height:50px;border-radius:16px;font-size:16px;white-space:nowrap}
.hero.dh .row2 .glass{flex:0 0 auto;height:50px;padding:0 16px;border-radius:16px;font-size:14.5px;white-space:nowrap;max-width:none;border:1.5px solid var(--line)}
.hero.dh .row2 .fav.on{border-color:var(--accent);color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,var(--panel))}
.hero.dh .row2 .sh{flex:0 0 50px;width:50px;padding:0;display:grid;place-items:center}
.hero.dh .row2 .glass:active,.hero.dh .row2 .pri:active{transform:scale(.97)}
/* --- season chips in one line, episode rows with thumbnail --- */
.chips{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;margin-right:-16px;padding-right:16px}
.chips::-webkit-scrollbar{display:none}
.chips .chip{flex:0 0 auto;white-space:nowrap}
.epc .eth{position:relative;flex:0 0 112px;aspect-ratio:16/9;border-radius:10px;overflow:hidden;background:var(--panel2) center 25%/cover no-repeat}
.epc .eth::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 40%,rgba(0,0,0,.65))}
.epc .eth b{position:absolute;z-index:1;left:7px;bottom:4px;color:#fff;font-size:15px;font-weight:900;font-style:italic;text-shadow:0 1px 4px rgba(0,0,0,.7)}
.epc .eth i{position:absolute;z-index:1;left:0;bottom:0;height:3px;background:var(--accent)}
.epc .ec{flex:1;min-width:0;display:grid;gap:2px}
.epc .et{white-space:nowrap}
.epc .es{font-size:11.5px;font-weight:600;color:var(--dim)}
.ep.epc.seen::before{top:6px;left:8px}
/* ===== v5: Top 10 stays put, poster genres, account page, episode progress, bright hero ===== */
.rail{overflow-y:hidden;align-items:start;overscroll-behavior-x:contain;padding-top:2px}
.t10{height:auto}
/* hero: no dimming layers, no fade-in flash */
.hban::after{display:none}
.hero .bg{filter:blur(22px) brightness(.92) saturate(1.15);animation:none}
.hero.land .bg{transform:none;filter:none}
.hero .art{animation:none}
html.lite .hero .bg{filter:blur(14px) brightness(.92)!important}
html.lite .hero.land .bg{filter:none!important}
html:not(.lite) .hero .in2>*{animation:none}
/* genre tiles with posters */
.gnow{margin:8px 0 0}
.gtr{grid-auto-columns:min(150px,40vw)!important;gap:12px}
.gtile{position:relative;display:block;aspect-ratio:3/4;border-radius:18px;overflow:hidden;border:0;padding:0;background:var(--panel2);text-align:left;color:#fff;box-shadow:0 8px 22px rgba(0,0,0,.3);transition:transform .12s}
.gtile:active{transform:scale(.97)}
.gtile .pw{position:absolute;inset:0;width:100%;height:100%;aspect-ratio:auto;border-radius:0;box-shadow:none}
.gtile .pw::before{display:none}
.gtile .pw.ptr .poster{object-fit:cover}
.gtile::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(180deg,transparent 40%,rgba(0,0,0,.8))}
.gtile .gtl{position:absolute;left:12px;right:12px;bottom:11px;z-index:2;display:block}
.gtile .gtl b{display:block;font-size:16px;font-weight:800;line-height:1.15}
.gtile .gtl small{display:block;font-size:11.5px;font-weight:600;opacity:.82;margin-top:2px}
.gtile[aria-pressed=true]{outline:3px solid var(--accent);outline-offset:-3px}
/* watch page: episode boxes with progress */
.eps:not(.epl){grid-template-columns:repeat(auto-fill,minmax(72px,1fr))}
.eps:not(.epl) .ep{flex-direction:column;justify-content:center;gap:6px;padding:10px 9px 8px;min-height:66px}
.ep .en2{font-size:17px;font-weight:800;line-height:1}
.ep .epm{display:block;width:100%;height:4px;border-radius:4px;background:color-mix(in srgb,var(--text) 14%,transparent);overflow:hidden}
.ep .epm i{display:block;height:100%;width:0;background:var(--accent);border-radius:4px;transition:width .4s}
.ep .epp{display:block;font-size:10.5px;font-weight:700;line-height:1;min-height:11px;color:var(--dim)}
.ep.done .epp,.ep.cur .epp{color:var(--accent)}
/* account page */
.acbox{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:6px 16px;margin-bottom:12px}
.acp{display:flex;gap:14px;align-items:center;padding:10px 0}
.acp b{display:block;font-size:17px}
.acp small{display:block;color:var(--dim);font-size:13px;margin-top:2px}
.acav{width:52px;height:52px;border-radius:50%;background:var(--accent);color:#170904;display:grid;place-items:center;font-size:22px;font-weight:900;font-style:italic;flex:0 0 auto}
.acbtn{width:100%;height:48px;border-radius:999px;margin:4px 0 12px}
.acli{display:flex;justify-content:space-between;align-items:center;gap:12px;width:100%;padding:14px 0;border:0;border-top:1px solid var(--line);background:none;font-weight:600;text-align:left;color:var(--text)}
.acli:first-child{border-top:0}
.acli select{width:auto;max-width:150px}
.acact span:last-child{color:var(--dim);font-size:20px}
.tgl{position:relative;width:48px;height:28px;border-radius:999px;border:0;padding:0;background:var(--line);flex:0 0 auto;transition:background .2s}
.tgl i{position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:transform .2s}
.tgl.on{background:var(--accent)}
.tgl.on i{transform:translateX(20px)}
.acout{width:100%;height:48px;border-radius:999px;font-weight:700}
/* ===== v6: sharp full-bleed hero, landscape genre tiles, tighter gaps ===== */
.hero.land .bg{display:none}
.hero.land .art{display:block;position:absolute;inset:0;left:0;top:0;width:100%;height:100%;max-width:none;max-height:none;transform:none;border-radius:0;object-fit:cover;object-position:center 25%;box-shadow:none;filter:saturate(1.08) contrast(1.03)}
.hero:not(.land) .art{object-fit:contain}
.gtr{grid-auto-columns:min(250px,70vw)!important}
.gtile{aspect-ratio:16/9;border-radius:16px}
.gtile::after{background:linear-gradient(180deg,transparent 35%,rgba(0,0,0,.82))}
.gtile .gtl{left:14px;bottom:10px}
.gtile .gtl b{font-size:18px}
.rail .card{content-visibility:visible}
@media(max-width:759px){
h2.sec{margin:14px 0 8px}
.rail{padding-bottom:0;margin-bottom:0}
.card .t{padding:7px 2px 0}
.hero:not(.dh) .seg{margin:10px 0 0}
.t10 .n{margin-bottom:26px}
}
/* episode rows without thumbnails: number tile + thin progress strip */
.ep.epc{overflow:hidden}
.epc .en{flex:0 0 46px;height:46px}
.epbar{position:absolute;left:0;bottom:0;height:3px;background:var(--accent);border-radius:0 3px 3px 0}
/* ===== v7: custom player controls ===== */
.cbar .csel{display:none}
.player video{width:100%;height:100%;object-fit:contain;background:#000}
.pi{display:inline-grid;place-items:center;width:24px;height:24px}
.pi svg{width:100%;height:100%}
.pc{position:absolute;inset:0;z-index:5;color:#fff;opacity:0;pointer-events:none;transition:opacity .25s;background:linear-gradient(180deg,rgba(0,0,0,.7),transparent 30%,transparent 52%,rgba(0,0,0,.85))}
.pc.on{opacity:1}
.pc.on>*{pointer-events:auto}
.pt{position:absolute;top:0;left:0;right:56px;padding:10px 6px 0 max(12px,env(safe-area-inset-left));display:flex;flex-direction:column;gap:1px}
.pt b{font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pt small{font-size:12px;opacity:.8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pb{background:none;border:0;color:#fff;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;padding:0;transition:background .15s,transform .15s}
.pb:active{background:rgba(255,255,255,.2);transform:scale(.92)}
.pg{position:absolute;top:2px;right:max(4px,env(safe-area-inset-right))}
.pbt{position:absolute;left:0;right:0;bottom:0;padding:0 max(10px,env(safe-area-inset-right)) 4px max(10px,env(safe-area-inset-left))}
.ps{position:relative;height:22px;display:flex;align-items:center;touch-action:none;cursor:pointer}
.ps::before{content:"";position:absolute;left:0;right:0;height:3px;border-radius:3px;background:rgba(255,255,255,.28);transition:height .15s}
.ps i{position:absolute;left:0;height:3px;border-radius:3px;transition:height .15s}
.pbuf{background:rgba(255,255,255,.4)}
.pfil{background:var(--accent)}
.pth{position:absolute;left:0;width:13px;height:13px;margin-left:-6px;border-radius:50%;background:var(--accent);transform:scale(.9);transition:transform .15s}
.ps.drag::before,.ps.drag i{height:5px}
.ps.drag .pth{transform:scale(1.5)}
.ptip{position:absolute;bottom:22px;transform:translateX(-50%);background:rgba(0,0,0,.8);padding:2px 7px;border-radius:6px;font:600 12px/1.4 inherit;font-style:normal;opacity:0;transition:opacity .15s;pointer-events:none}
.ps.drag .ptip{opacity:1}
.ptm{display:flex;justify-content:space-between;font-size:11px;font-weight:600;opacity:.85;margin-top:-2px}
.pr{display:flex;align-items:center;gap:2px}
.psp{flex:1}
.pp{width:46px;height:46px;background:rgba(255,255,255,.14)}
.pm,.pe{position:absolute;z-index:7;opacity:0;pointer-events:none;transition:opacity .22s,transform .22s;background:rgba(18,18,22,.94);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);color:#fff}
.pm.on,.pe.on{opacity:1;pointer-events:auto;transform:none}
.pm{inset:0;overflow:auto;padding:6px 10px;transform:translateY(10px)}
.mr{display:flex;align-items:center;gap:8px;width:100%;background:none;border:0;color:#fff;padding:10px;border-radius:10px;font-size:14px;font-weight:600;text-align:left}
.mr:active{background:rgba(255,255,255,.12)}
.mr>span:first-child{flex:1;display:flex;align-items:center;gap:6px}
.mr .mv{opacity:.7;font-weight:500;font-size:13px}
.mh{border-bottom:1px solid rgba(255,255,255,.12);border-radius:10px 10px 0 0;margin-bottom:4px}
.mo{width:24px;flex:0 0 auto!important;color:var(--accent)}
.sw{width:36px;height:20px;border-radius:20px;background:rgba(255,255,255,.3);position:relative;transition:background .2s}
.sw i{position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:transform .2s}
.sw.on{background:var(--accent)}
.sw.on i{transform:translateX(16px)}
.pe{top:0;right:0;bottom:0;width:min(420px,64%);overflow:auto;padding:10px max(10px,env(safe-area-inset-right)) 10px 12px;transform:translateX(100%)}
.peh{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.peh b{font-size:16px}
.pe .eps{grid-template-columns:repeat(auto-fill,minmax(58px,1fr))!important;gap:8px}
.player.fs .pt{padding-top:max(14px,env(safe-area-inset-top))}
.player.fs .pt b{font-size:17px}
.player.fs .pt small{font-size:14px}
.player.fs .pb{width:48px;height:48px}
.player.fs .pp{width:54px;height:54px}
.player.fs .pm{inset:auto max(12px,env(safe-area-inset-right)) 96px auto;width:300px;max-height:calc(100% - 120px);border-radius:14px;padding:6px;transform:translateY(10px) scale(.97);transform-origin:bottom right}
.player.fs .pm.on{transform:none}
.player.fs .pe{width:min(50%,460px)}
.player.fs .ptm{font-size:13px}
.player.fs .pbt{padding-bottom:max(10px,env(safe-area-inset-bottom))}
/* ===== v8: player fixes (laptop + mobile portrait/landscape + TV) ===== */
.pc{visibility:hidden;transition:opacity .25s,visibility 0s .25s}
.pc.on{visibility:visible;transition:opacity .25s}
.pm,.pe{visibility:hidden;transition:opacity .22s,transform .22s,visibility 0s .22s}
